<!DOCTYPE html>
<html>
    <head>

    </head>
    <link href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap" rel="stylesheet">
     <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

    <style>
        body
        {
            display: flex;
            margin-top: 40px;
            justify-content: center;
            background:radial-gradient(circle at 40% 50%,#1f81f0,transparent 90%);
            background-attachment: fixed;
        }
        form
        {
         width: 90%;
         display: flex;
         flex-direction: column;
         gap: 15px;
        }

        #content
        {
            border: 1px solid grey;
            border-radius: 10px;
            padding:30px;
            backdrop-filter: blur(100px);
           
            margin-bottom:30px;
        }
         h1
         {
            color: white;
            font-family: "Carter One", system-ui;
            letter-spacing: 1px;
            text-shadow: 0 0 20px yellowgreen;
        }
         input[type="text"]
         {
            height: 40px;
            border:none;
            max-width: 600px;
            border-radius:10px;
            padding-left:10px;
            font-weight:bold;
            outline:none;
            transition:0.3s ease all;
            border:1px solid #0f064a;
            font-family: "Poppins",sans-serif;
         }
         input[type="text"]:hover
         {
            transform:scale(1.05);
            box-shadow:0 0 30px #85ddf1;
         }
         textarea
         {
         max-width: 600px;
         max-height: 700px;
         border-radius:10px;
         }
         input[type="submit"]
         {
            padding:15px;
            border-radius:20px;
            outline: none;
            border:none;
            font-weight: bold;
            font-size: 20px;
            width: 200px;
            margin: auto;
            background: radial-gradient(circle at 20% 70%,blue,transparent 60%),radial-gradient(circle at 90% 90%,#8f3ae4,transparent 60%),linear-gradient(135deg,#2465ff,#4074e6);
            color:white;
            transition:0.3s ease all;
        }
        input[type="submit"]:hover{
          transform:scale(1.06);
          cursor: pointer;
          box-shadow:0 0 20px #28d40e;
        }
        textarea
        {
            outline:none;
            border:none;
            padding: 10px;
            font-size:15px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
           transition:0.3s ease all;
        }
        textarea:hover
        {
            box-shadow: 0 0 10px navy;
        }
        a
        {
            text-align: center;
            background-color: white;
            padding:15px 5px;
            width:60%;
            margin: auto;
            text-decoration: none;
            font-weight:bold;
            font-family:"Poppins",sans-serif;
           border-radius: 20px;
           transition: 0.3s ease all;
        }
        a:hover{
            transform:scale(1.05);
            background-color: red;
            color:white;
        }
     </style>
<body>
     <div id="content">
    <h1>create your note</h1>
    <form method="POST" action="create.php"> 
       <input type="text" required name="name"  placeholder="Enter Your Note Title"><br>
       <textarea rows="10" cols="40"  placeholder="Enter Your Note" name="content" required></textarea><br>
       <input type="submit" value="Create"><br>

    </form>
     </div>
